name: Build Project Dream Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      game_url:
        description: Sonic Dream Team macOS ZIP
        required: true
        default: 'https://archive.org/download/sonic-dream-team-1.10.1-mac-os-universal/Sonic-Dream-Team-1.10.1-macOS-universal.zip'
      installer_url:
        description: Project Dream installer
        required: true
        default: 'https://github.com/RaptorKillz12/Project-Dream-Release/releases/download/V1.0.0/Project_Dream_v1.0.0.exe'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove previous downloaded files and build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "game.zip",
            "game",
            "installer/Project_Dream_v1.0.0.exe",
            "installer/wine-mono.msi",
            "output",
            "diagnostics",
            "release-assets",
            "run_installer.py"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
              Write-Host "Removed previous file/folder: $path"
            }
          }

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force game, installer, output, diagnostics | Out-Null

      - name: Download game and installer
        shell: pwsh
        env:
          GAME_URL: ${{ inputs.game_url || 'https://archive.org/download/sonic-dream-team-1.10.1-mac-os-universal/Sonic-Dream-Team-1.10.1-macOS-universal.zip' }}
          INSTALLER_URL: ${{ inputs.installer_url || 'https://github.com/RaptorKillz12/Project-Dream-Release/releases/download/V1.0.0/Project_Dream_v1.0.0.exe' }}
        run: |
          $ErrorActionPreference = "Stop"

          function Download-File {
            param(
              [Parameter(Mandatory=$true)][string]$Url,
              [Parameter(Mandatory=$true)][string]$Output,
              [Parameter(Mandatory=$true)][int]$MaxSeconds
            )

            Write-Host "Downloading $Output"
            Write-Host "Source host: $(([uri]$Url).Host)"

            if (Test-Path $Output) {
              Remove-Item $Output -Force
            }

            & curl.exe --location --fail --show-error --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time $MaxSeconds --speed-time 120 --speed-limit 1024 --output $Output $Url

            if ($LASTEXITCODE -ne 0) {
              throw "Download failed for $Output (curl exit code $LASTEXITCODE)."
            }

            if (-not (Test-Path $Output)) {
              throw "Download did not create $Output."
            }

            $item = Get-Item $Output
            if ($item.Length -lt 1048576) {
              throw "Downloaded file is unexpectedly small ($($item.Length) bytes): $Output"
            }

            Write-Host ("Downloaded {0:N1} MB to {1}" -f ($item.Length / 1MB), $Output)
          }

          Download-File -Url $env:INSTALLER_URL -Output "installer/Project_Dream_v1.0.0.exe" -MaxSeconds 900
          Download-File -Url $env:GAME_URL -Output "game.zip" -MaxSeconds 3600

          $zipBytes = [System.IO.File]::ReadAllBytes((Resolve-Path "game.zip"))
          if ($zipBytes.Length -lt 4 -or $zipBytes[0] -ne 0x50 -or $zipBytes[1] -ne 0x4B) {
            throw "The game download is not a valid ZIP file (missing PK signature)."
          }

          $exeBytes = [System.IO.File]::ReadAllBytes((Resolve-Path "installer/Project_Dream_v1.0.0.exe"))
          if ($exeBytes.Length -lt 2 -or $exeBytes[0] -ne 0x4D -or $exeBytes[1] -ne 0x5A) {
            throw "The Project Dream download is not a valid Windows executable (missing MZ signature)."
          }

          Write-Host "Both downloads passed basic file checks."

      - name: Extract Sonic Dream Team
        shell: pwsh
        run: |
          Expand-Archive game.zip -DestinationPath game -Force

          $app = Get-ChildItem game -Directory -Recurse |
            Where-Object { $_.Name -eq "SonicDreamTeam.app" } |
            Select-Object -First 1

          if (-not $app) {
            throw "SonicDreamTeam.app was not found in the downloaded archive."
          }

          $contents = Join-Path $app.FullName "Contents"

          if (-not (Test-Path $contents)) {
            throw "SonicDreamTeam.app/Contents was not found."
          }

          "GAME_CONTENTS=$contents" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Game contents: $contents"

      - name: Install UI automation
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install pywinauto pyautogui pillow flask

      - name: Prepare secure browser tunnel
        shell: pwsh
        env:
          REMOTE_CONTROL_PASSWORD: ${{ secrets.REMOTE_CONTROL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:REMOTE_CONTROL_PASSWORD)) {
            throw "Add the repository Actions secret REMOTE_CONTROL_PASSWORD before running this workflow."
          }
          Write-Output "::add-mask::$env:REMOTE_CONTROL_PASSWORD"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:RUNNER_TEMP\cloudflared.exe"
          if (-not (Test-Path "$env:RUNNER_TEMP\cloudflared.exe")) {
            throw "cloudflared download failed."
          }
          Write-Host "Secure tunnel client prepared. It will be started inside the installer step so it remains alive."

      - name: Run Project Dream Android installer
        shell: pwsh
        timeout-minutes: 100
        env:
          REMOTE_CONTROL_TOKEN: ${{ secrets.REMOTE_CONTROL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $outLog = "$env:RUNNER_TEMP\cloudflared-out.log"
          $errLog = "$env:RUNNER_TEMP\cloudflared-err.log"
          Remove-Item $outLog, $errLog -Force -ErrorAction SilentlyContinue
          $cloudflared = Start-Process -FilePath "$env:RUNNER_TEMP\cloudflared.exe" -ArgumentList @("tunnel","--url","http://127.0.0.1:8765","--no-autoupdate") -PassThru -WindowStyle Hidden -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $tunnel = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            $logs = ""
            if (Test-Path $outLog) { $logs += Get-Content $outLog -Raw }
            if (Test-Path $errLog) { $logs += Get-Content $errLog -Raw }
            if ($logs -match 'https://[a-z0-9-]+\.trycloudflare\.com') { $tunnel = $Matches[0]; break }
            if ($cloudflared.HasExited) { throw "cloudflared exited before creating the tunnel. $logs" }
          }
          if (-not $tunnel) { throw "Timed out waiting for the browser tunnel URL." }
          $remoteUrl = "$tunnel/"
          $summary = @(
            "## Installer remote control",
            "",
            "[**Open the live Project Dream installer control page**]($remoteUrl)",
            "",
            "Temporary link; it remains active only while the installer step is running."
          ) -join "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "REMOTE CONTROL LINK (private, temporary): $remoteUrl"
          Write-Host "Tunnel process PID: $($cloudflared.Id)"

          @'
          import os
          import sys
          import time
          import traceback
          from pathlib import Path
          from pywinauto import Desktop, Application
          import pyautogui

          exe = Path("installer/Project_Dream_v1.0.0.exe").resolve()
          game = Path(os.environ["GAME_CONTENTS"]).resolve()
          diagnostics = Path("diagnostics")
          diagnostics.mkdir(exist_ok=True)

          def screenshot(name):
              pyautogui.screenshot().save(diagnostics / name)

          def describe(window):
              try:
                  return f"title={window.window_text()!r}, rect={window.rectangle()}"
              except Exception:
                  return "unreadable window"

          def dump_all_windows():
              lines = []
              desktop = Desktop(backend="uia")
              for window in desktop.windows():
                  lines.append(describe(window))
                  try:
                      for control in window.descendants():
                          try:
                              lines.append(
                                  f"  {control.element_info.control_type}: "
                                  f"{control.window_text()!r}"
                              )
                          except Exception:
                              pass
                  except Exception:
                      pass
              (diagnostics / "controls.txt").write_text(
                  "\n".join(lines), encoding="utf-8"
              )

          def find_folder_dialog():
              desktop = Desktop(backend="uia")
              for window in desktop.windows():
                  try:
                      title = (window.window_text() or "").strip().lower()
                      if "select game" in title and "folder" in title:
                          return window
                  except Exception:
                      pass
              return None

          def find_installer_window():
              desktop = Desktop(backend="uia")
              candidates = []
              for window in desktop.windows():
                  try:
                      title = (window.window_text() or "").strip().lower()
                      if not title or title in ("desktop", "program manager"):
                          continue
                      controls = window.descendants()
                      labels = []
                      for control in controls:
                          try:
                              labels.append((control.window_text() or "").strip().lower())
                          except Exception:
                              pass
                      if "android" in labels or "install" in labels:
                          candidates.append(window)
                  except Exception:
                      pass
              if not candidates:
                  return None
              return max(
                  candidates,
                  key=lambda w: w.rectangle().width() * w.rectangle().height()
              )

          try:
              app = Application(backend="uia").start(str(exe))
              print("Launched Project Dream installer; waiting for its game-folder picker.")

              # The installer opens a native Windows folder-picker first. Its
              # Folder field is already focused; it is not the installer's main UI.
              folder_dialog = None
              deadline = time.time() + 90
              while time.time() < deadline:
                  folder_dialog = find_folder_dialog()
                  if folder_dialog is not None:
                      break
                  time.sleep(2)

              screenshot("01-installer-start.png")
              dump_all_windows()

              if folder_dialog is None:
                  raise RuntimeError(
                      "The 'Select Game Contents Folder' dialog did not appear. "
                      "See diagnostics/controls.txt and the screenshot."
                  )

              folder_dialog.set_focus()
              time.sleep(1)

              # This is the Windows folder picker, not a text-entry prompt.
              # Set its actual "Folder:" edit control, then activate Select Folder.
              folder_edit = None
              for control in folder_dialog.descendants():
                  try:
                      info = control.element_info
                      if info.control_type == "Edit" and (info.name or "").strip().lower() == "folder:":
                          folder_edit = control
                          break
                  except Exception:
                      pass

              if folder_edit is None:
                  raise RuntimeError(
                      "The folder picker did not expose its Folder: edit field. "
                      "See diagnostics/controls.txt."
                  )

              folder_edit.set_edit_text(str(game))
              time.sleep(1)
              try:
                  entered = folder_edit.get_value()
              except Exception:
                  entered = folder_edit.window_text()

              if str(game).lower() not in str(entered).lower():
                  folder_edit.click_input()
                  pyautogui.hotkey("ctrl", "a")
                  pyautogui.write(str(game), interval=0.005)
                  time.sleep(1)

              select_button = None
              for control in folder_dialog.descendants():
                  try:
                      if (control.window_text() or "").strip().replace("&", "").lower() == "select folder":
                          select_button = control
                          break
                  except Exception:
                      pass

              if select_button is None:
                  raise RuntimeError(
                      "The folder picker did not expose its Select Folder button. "
                      "See diagnostics/controls.txt."
                  )

              select_button.click_input()
              time.sleep(5)
              screenshot("02-game-folder-selected.png")

              # Confirm that the folder picker actually closed before searching
              # for the installer's main window.
              deadline = time.time() + 30
              while time.time() < deadline:
                  if find_folder_dialog() is None:
                      break
                  time.sleep(1)
              else:
                  dump_all_windows()
                  raise RuntimeError(
                      "The Select Folder action did not close the game-folder picker. "
                      "See diagnostics/controls.txt."
                  )

              # Find the installer by its process ID. Its custom UI may not expose
              # accessible labels containing the words Android or Install.
              installer_pid = app.process
              window = None
              deadline = time.time() + 90
              while time.time() < deadline:
                  candidates = []
                  for candidate in Desktop(backend="uia").windows():
                      try:
                          if candidate.process_id() == installer_pid:
                              candidates.append(candidate)
                      except Exception:
                          pass
                  if candidates:
                      window = max(
                          candidates,
                          key=lambda w: w.rectangle().width() * w.rectangle().height()
                      )
                      break
                  time.sleep(2)

              dump_all_windows()
              if window is None:
                  raise RuntimeError(
                      "The Project Dream installer main window did not appear after "
                      "the game folder was selected. See diagnostics/controls.txt."
                  )

              window.set_focus()
              time.sleep(2)
              screenshot("03-installer-main.png")

              # Start an authenticated browser controller that exposes only this
              # installer window, not the Windows desktop.
              from flask import Flask, request, Response, jsonify
              import secrets
              from threading import Thread
              from werkzeug.serving import make_server
              import io
              from PIL import Image

              remote_app = Flask(__name__)
              remote_token = os.environ["REMOTE_CONTROL_TOKEN"]
              remote_window = window

              @remote_app.before_request
              def require_private_access_code():
                  auth = request.authorization
                  supplied = auth.password if auth and auth.username == "installer" and auth.password else ""
                  if not secrets.compare_digest(supplied, remote_token):
                      return Response(
                          "Private access code required.",
                          401,
                          {"WWW-Authenticate": 'Basic realm="Project Dream Installer"'}
                      )

              @remote_app.get("/")
              def remote_page():
                  return Response("""<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Project Dream Installer</title><style>
                  body{margin:0;background:#111;color:#eee;font:16px system-ui}header{padding:12px;position:sticky;top:0;background:#202020}main{padding:10px}img{width:100%;height:auto;display:block;background:#000;touch-action:manipulation}button,input{font:inherit;padding:12px;margin:4px;border-radius:8px;border:0}button{background:#3478f6;color:white}input{width:55%;background:#333;color:white}small{color:#aaa}
                  </style></head><body><header><b>Project Dream Installer</b><br><small>Private live view · installer window only</small></header><main><img id=screen alt="Installer window"><div><button onclick="refresh()">Refresh</button><button onclick="key('ENTER')">Enter</button><button onclick="key('ESC')">Esc</button><button onclick="key('TAB')">Tab</button></div><div><input id=txt placeholder="Type text"><button onclick="sendText()">Send</button></div><p id=status>Connecting…</p></main><script>
                  async function refresh(){try{let r=await fetch('/frame');if(!r.ok)throw Error(r.status);let b=await r.blob();let u=URL.createObjectURL(b);let im=document.getElementById('screen');im.onload=()=>URL.revokeObjectURL(u);im.src=u;document.getElementById('status').textContent='Connected';}catch(e){document.getElementById('status').textContent='Connection: '+e;}}
                  async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)document.getElementById('status').textContent='Control error: '+r.status;}
                  function key(k){post('/key',{key:k})}function sendText(){post('/text',{text:document.getElementById('txt').value});document.getElementById('txt').value='';}
                  document.getElementById('screen').addEventListener('click',e=>{let r=e.target.getBoundingClientRect();post('/click',{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});});
                  document.getElementById('screen').addEventListener('touchend',e=>{let t=e.changedTouches[0],r=e.target.getBoundingClientRect();post('/click',{x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height});},{passive:true});
                  refresh();setInterval(refresh,1200);
                  </script></body></html>""", mimetype="text/html")

              @remote_app.get("/frame")
              def remote_frame():
                  rect = remote_window.rectangle()
                  shot = pyautogui.screenshot(region=(rect.left, rect.top, rect.width(), rect.height()))
                  buf = io.BytesIO()
                  shot.save(buf, format="JPEG", quality=70)
                  return Response(buf.getvalue(), mimetype="image/jpeg", headers={"Cache-Control":"no-store"})

              @remote_app.post("/click")
              def remote_click():
                  data = request.get_json(force=True)
                  x = max(0.0, min(1.0, float(data.get("x", 0))))
                  y = max(0.0, min(1.0, float(data.get("y", 0))))
                  rect = remote_window.rectangle()
                  pyautogui.click(rect.left + int(x * rect.width()), rect.top + int(y * rect.height()))
                  return jsonify(ok=True)

              @remote_app.post("/key")
              def remote_key():
                  key_name = str(request.get_json(force=True).get("key", "")).lower()
                  allowed = {"enter":"enter","esc":"esc","tab":"tab","up":"up","down":"down","left":"left","right":"right","space":"space","backspace":"backspace"}
                  if key_name not in allowed: return ("Unsupported key", 400)
                  pyautogui.press(allowed[key_name])
                  return jsonify(ok=True)

              @remote_app.post("/text")
              def remote_text():
                  value = str(request.get_json(force=True).get("text", ""))[:500]
                  pyautogui.write(value, interval=0.02)
                  return jsonify(ok=True)

              server = make_server("127.0.0.1", 8765, remote_app, threaded=True)
              Thread(target=server.serve_forever, daemon=True).start()
              print("Authenticated installer-only browser control is ready.")
              print("Open the Installer remote control link in the workflow summary.")
              print("Use the page to choose Android and press Install.")

              deadline = time.time() + 90 * 60
              finished = False
              while time.time() < deadline:
                  time.sleep(15)
                  screenshot("progress-latest.png")
                  try:
                      if not app.is_process_running():
                          finished = True
                          break
                  except Exception:
                      pass

              if not finished:
                  raise TimeoutError("Installer did not finish within 90 minutes.")

              screenshot("06-installer-finished.png")
              print("Project Dream installer process finished.")

          except Exception:
              traceback.print_exc()
              try:
                  screenshot("failure.png")
                  dump_all_windows()
              except Exception:
                  pass
              sys.exit(1)
          '@ | Set-Content -Encoding UTF8 run_installer.py

          py run_installer.py

      - name: Collect Project Dream Android files
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force output/android | Out-Null

          # The installer's README specifies these exact output filenames.
          $wanted = @(
            "SonicDreamTeam.apk",
            "main.1.com.sonicdreamteam.android.obb"
          )
          $roots = @($env:GITHUB_WORKSPACE, $env:USERPROFILE) | Select-Object -Unique

          foreach ($name in $wanted) {
            $matches = foreach ($root in $roots) {
              if (Test-Path $root) {
                Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Name -ieq $name -and
                    $_.FullName -notlike "$env:GITHUB_WORKSPACE\output\*" -and
                    $_.FullName -notlike "$env:GITHUB_WORKSPACE\release-assets\*"
                  }
              }
            }

            $file = $matches | Sort-Object Length -Descending | Select-Object -First 1
            if ($file) {
              Copy-Item -LiteralPath $file.FullName -Destination (Join-Path "output/android" $name) -Force
              Write-Host ("Collected {0}: {1:N2} GB" -f $name, ($file.Length / 1GB))
              Get-FileHash (Join-Path "output/android" $name) -Algorithm SHA256
            } else {
              Write-Host "$name was not found."
            }
          }

      - name: Validate Project Dream Android files
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $apk = "output/android/SonicDreamTeam.apk"
          $obb = "output/android/main.1.com.sonicdreamteam.android.obb"

          if (-not (Test-Path $apk)) {
            throw "SonicDreamTeam.apk was not generated. The installer README specifies this exact filename."
          }
          if ((Get-Item $apk).Length -lt 1MB) {
            throw "SonicDreamTeam.apk is unexpectedly small."
          }
          if (-not (Test-Path $obb)) {
            throw "The required Android OBB was not generated: main.1.com.sonicdreamteam.android.obb"
          }
          if ((Get-Item $obb).Length -lt 1MB) {
            throw "The Android OBB is unexpectedly small."
          }

          foreach ($file in @($apk, $obb)) {
            Write-Host ("Validated {0}: {1:N2} GB" -f $file, ((Get-Item $file).Length / 1GB))
            Get-FileHash $file -Algorithm SHA256
          }

      - name: Prepare Project Dream Android release assets
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = "release-assets"
          New-Item -ItemType Directory -Force $assets | Out-Null

          # GitHub Releases limits each individual asset to 2 GiB.
          # Split both files into numbered parts smaller than that limit.
          $maxPartBytes = 1800MB
          foreach ($source in @(
            "output/android/SonicDreamTeam.apk",
            "output/android/main.1.com.sonicdreamteam.android.obb"
          )) {
            $input = [System.IO.File]::OpenRead($source)
            try {
              $buffer = New-Object byte[] (8MB)
              $part = 0
              while ($input.Position -lt $input.Length) {
                $part++
                $name = Join-Path $assets ("{0}.part{1:D3}" -f (Split-Path $source -Leaf), $part)
                $output = [System.IO.File]::Create($name)
                try {
                  $remaining = [Math]::Min([int64]$maxPartBytes, $input.Length - $input.Position)
                  while ($remaining -gt 0) {
                    $read = $input.Read($buffer, 0, [int][Math]::Min($buffer.Length, $remaining))
                    if ($read -le 0) { throw "Unexpected end of file while splitting $source." }
                    $output.Write($buffer, 0, $read)
                    $remaining -= $read
                  }
                } finally {
                  $output.Dispose()
                }
                Write-Host "Created $name"
              }
            } finally {
              $input.Dispose()
            }
          }

          Get-ChildItem $assets -File | ForEach-Object {
            Write-Host ("{0}: {1:N2} MB" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Publish Project Dream Android files to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: projectdream-android-${{ github.run_id }}-${{ github.run_attempt }}
          name: Project Dream Android APK and OBB
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/SonicDreamTeam.apk.part*
            release-assets/main.1.com.sonicdreamteam.android.obb.part*
          body: |
            Project Dream Android output.

            This release contains both required files, split into numbered parts when needed because GitHub Releases limits individual assets to 2 GiB.

            Download every part for each file into the same folder. Reassemble the APK and OBB separately, in ascending part-number order, using PowerShell:

            ```powershell
            foreach ($base in @("SonicDreamTeam.apk", "main.1.com.sonicdreamteam.android.obb")) {
              $out = [System.IO.File]::Create($base)
              try {
                Get-ChildItem "$base.part*" | Sort-Object Name | ForEach-Object {
                  $input = [System.IO.File]::OpenRead($_.FullName)
                  try { $input.CopyTo($out) } finally { $input.Dispose() }
                }
              } finally { $out.Dispose() }
            }
            ```

            Install SonicDreamTeam.apk, then place main.1.com.sonicdreamteam.android.obb in Android/obb/com.sonicdreamteam.android/.
