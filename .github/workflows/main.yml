
name: Build Project Dream Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      game_url:
        description: Sonic Dream Team macOS ZIP
        required: true
        default: 'https://archive.org/download/sonic-dream-team-1.10.1-mac-os-universal/Sonic-Dream-Team-1.10.1-macOS-universal.zip'
      installer_url:
        description: Project Dream installer
        required: true
        default: 'https://github.com/RaptorKillz12/Project-Dream-Release/releases/download/V1.0.0/Project_Dream.exe'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous files
        shell: pwsh
        run: |
          $paths = @(
            "game.zip",
            "game",
            "installer",
            "output",
            "diagnostics",
            "release-assets",
            "run_installer.py"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            game, installer, output, diagnostics, release-assets |
            Out-Null

      - name: Download game and installer
        shell: pwsh
        env:
          GAME_URL: ${{ inputs.game_url || 'https://archive.org/download/sonic-dream-team-1.10.1-mac-os-universal/Sonic-Dream-Team-1.10.1-macOS-universal.zip' }}
          INSTALLER_URL: ${{ inputs.installer_url || 'https://github.com/RaptorKillz12/Project-Dream-Release/releases/download/V1.0.0/Project_Dream.exe' }}
        run: |
          $ErrorActionPreference = "Stop"

          function Download-File($Url, $Output, $MaxSeconds) {
            Write-Host "Downloading $Output"

            curl.exe --location --fail --show-error `
              --retry 3 --retry-all-errors `
              --connect-timeout 30 `
              --max-time $MaxSeconds `
              --output $Output $Url

            if ($LASTEXITCODE -ne 0) {
              throw "Download failed: $Output"
            }

            if ((Get-Item $Output).Length -lt 1MB) {
              throw "Downloaded file is too small: $Output"
            }
          }

          Download-File $env:INSTALLER_URL `
            "installer/Project_Dream.exe" 900

          Download-File $env:GAME_URL "game.zip" 3600

          $zip = [IO.File]::ReadAllBytes(
            (Resolve-Path "game.zip")
          )

          if ($zip[0] -ne 0x50 -or $zip[1] -ne 0x4B) {
            throw "Invalid game ZIP."
          }

          $exe = [IO.File]::ReadAllBytes(
            (Resolve-Path "installer/Project_Dream.exe")
          )

          if ($exe[0] -ne 0x4D -or $exe[1] -ne 0x5A) {
            throw "Invalid Project Dream executable."
          }

          Write-Host "Downloads verified."

      - name: Extract Sonic Dream Team
        shell: pwsh
        run: |
          Expand-Archive game.zip -DestinationPath game -Force

          $app = Get-ChildItem game -Directory -Recurse |
            Where-Object Name -eq "SonicDreamTeam.app" |
            Select-Object -First 1

          if (-not $app) {
            throw "SonicDreamTeam.app not found."
          }

          $contents = Join-Path $app.FullName "Contents"

          if (-not (Test-Path $contents)) {
            throw "Game Contents folder not found."
          }

          "GAME_CONTENTS=$contents" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Game contents: $contents"

      - name: Install UI automation
        shell: pwsh
        run: |
          py -m pip install --upgrade pip
          py -m pip install pywinauto pyautogui pillow flask

      - name: Prepare secure browser tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "$env:RUNNER_TEMP\cloudflared.exe"

      - name: Run Project Dream Android installer
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 100
        env:
          REMOTE_CONTROL_TOKEN: ${{ secrets.REMOTE_CONTROL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $outLog = "$env:RUNNER_TEMP\cloudflared-out.log"
          $errLog = "$env:RUNNER_TEMP\cloudflared-err.log"

          Remove-Item $outLog, $errLog -Force -ErrorAction SilentlyContinue

          $cloudflared = Start-Process `
            -FilePath "$env:RUNNER_TEMP\cloudflared.exe" `
            -ArgumentList @(
              "tunnel", "--url",
              "http://127.0.0.1:8765",
              "--no-autoupdate"
            ) `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog

          $tunnel = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            if ($cloudflared.HasExited) {
              throw "cloudflared exited before connecting."
            }
            $logs = ""
            if (Test-Path $outLog) { $logs += Get-Content $outLog -Raw }
            if (Test-Path $errLog) { $logs += Get-Content $errLog -Raw }
            if ($logs -match 'https://[a-z0-9-]+\.trycloudflare\.com') {
              $tunnel = $Matches[0]
              break
            }
          }

          if (-not $tunnel) {
            if (Test-Path $outLog) { Get-Content $outLog }
            if (Test-Path $errLog) { Get-Content $errLog }
            throw "Cloudflare tunnel failed to start."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "PROJECT DREAM REMOTE INSTALLER LINK:"
          Write-Host "$tunnel/"
          Write-Host "Username: installer"
          Write-Host "Password: repository secret REMOTE_CONTROL_PASSWORD"
          Write-Host "=============================================="
          Write-Host "Keep this installer step running while using the link."

          @'
          import os
          import time
          import io
          import secrets
          import traceback
          from pathlib import Path
          from threading import Thread

          import pyautogui
          from pywinauto import Desktop, Application
          from flask import Flask, request, Response, jsonify
          from werkzeug.serving import make_server

          exe = Path("installer/Project_Dream.exe").resolve()
          game = Path(os.environ["GAME_CONTENTS"]).resolve()
          diagnostics = Path("diagnostics")
          diagnostics.mkdir(exist_ok=True)

          def screenshot(name):
              pyautogui.screenshot().save(diagnostics / name)

          def find_folder_dialog():
              for w in Desktop(backend="uia").windows():
                  try:
                      if "select game" in w.window_text().lower():
                          return w
                  except Exception:
                      pass
              return None

          def dump_windows():
              lines = []
              for w in Desktop(backend="uia").windows():
                  try:
                      lines.append(
                          f"{w.window_text()} PID={w.process_id()} "
                          f"RECT={w.rectangle()}"
                      )
                      for c in w.descendants():
                          try:
                              lines.append(
                                  f"  {c.element_info.control_type}: "
                                  f"{c.window_text()}"
                              )
                          except Exception:
                              pass
                  except Exception:
                      pass

              (diagnostics / "controls.txt").write_text(
                  "\n".join(lines), encoding="utf-8"
              )

          try:
              app = Application(backend="uia").start(str(exe))
              print("Project Dream launched.")

              dialog = None
              deadline = time.time() + 90

              while time.time() < deadline:
                  dialog = find_folder_dialog()
                  if dialog:
                      break
                  time.sleep(2)

              screenshot("01-installer-start.png")
              dump_windows()

              if not dialog:
                  raise RuntimeError(
                      "Select Game Contents Folder dialog not found."
                  )

              dialog.set_focus()

              folder_edit = None

              for c in dialog.descendants():
                  try:
                      if (
                          c.element_info.control_type == "Edit"
                          and c.element_info.name.strip().lower() == "folder:"
                      ):
                          folder_edit = c
                          break
                  except Exception:
                      pass

              if not folder_edit:
                  raise RuntimeError("Folder field not found.")

              folder_edit.set_edit_text(str(game))
              time.sleep(1)

              select_button = None

              for c in dialog.descendants():
                  try:
                      if (
                          c.window_text().strip().replace("&", "").lower()
                          == "select folder"
                      ):
                          select_button = c
                          break
                  except Exception:
                      pass

              if not select_button:
                  raise RuntimeError("Select Folder button not found.")

              select_button.click_input()
              time.sleep(5)

              screenshot("02-game-selected.png")

              deadline = time.time() + 30

              while time.time() < deadline:
                  if find_folder_dialog() is None:
                      break
                  time.sleep(1)
              else:
                  raise RuntimeError("Folder picker did not close.")

              pid = app.process
              window = None
              deadline = time.time() + 90

              while time.time() < deadline:
                  candidates = []

                  for w in Desktop(backend="uia").windows():
                      try:
                          if w.process_id() == pid:
                              candidates.append(w)
                      except Exception:
                          pass

                  if candidates:
                      window = max(
                          candidates,
                          key=lambda w: (
                              w.rectangle().width()
                              * w.rectangle().height()
                          )
                      )
                      break

                  time.sleep(2)

              dump_windows()

              if not window:
                  raise RuntimeError("Installer window not found.")

              window.set_focus()
              screenshot("03-installer-main.png")

              remote = Flask(__name__)
              token = os.environ["REMOTE_CONTROL_TOKEN"]

              @remote.before_request
              def authenticate():
                  auth = request.authorization
                  supplied = (
                      auth.password
                      if auth and auth.username == "installer"
                      and auth.password else ""
                  )

                  if not secrets.compare_digest(supplied, token):
                      return Response(
                          "Access code required.",
                          401,
                          {
                              "WWW-Authenticate":
                              'Basic realm="Project Dream Installer"'
                          }
                      )

              @remote.get("/")
              def index():
                  return Response("""<!doctype html>
          <html>
          <head>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Project Dream Installer</title>
          <style>
          body{background:#111;color:white;font:16px system-ui;margin:0;padding:15px}
          button,input{padding:13px;margin:5px;border:0;border-radius:8px}
          button{background:#3478f6;color:white}
          img{width:100%;background:black;touch-action:manipulation}
          </style>
          </head>
          <body>
          <h2>Project Dream Android Installer</h2>
          <img id="screen">
          <p>
          <button onclick="refresh()">Refresh</button>
          <button onclick="key('ENTER')">Enter</button>
          <button onclick="key('ESC')">Esc</button>
          <button onclick="key('TAB')">Tab</button>
          <button onclick="key('UP')">Up</button>
          <button onclick="key('DOWN')">Down</button>
          </p>
          <input id="txt" placeholder="Type text">
          <button onclick="sendText()">Send</button>
          <p id="status">Connecting...</p>
          <script>
          async function refresh(){
            try{
              let r=await fetch('/frame');
              if(!r.ok)throw Error(r.status);
              let b=await r.blob();
              let u=URL.createObjectURL(b);
              let im=document.getElementById('screen');
              im.onload=()=>URL.revokeObjectURL(u);
              im.src=u;
              document.getElementById('status').textContent='Connected';
            }catch(e){
              document.getElementById('status').textContent=e;
            }
          }
          function key(k){post('/key',{key:k})}
          function sendText(){
            post('/text',{text:document.getElementById('txt').value});
            document.getElementById('txt').value='';
          }
          async function post(path,data){
            await fetch(path,{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify(data)
            });
          }
          document.getElementById('screen').addEventListener('click',e=>{
            let r=e.target.getBoundingClientRect();
            post('/click',{
              x:(e.clientX-r.left)/r.width,
              y:(e.clientY-r.top)/r.height
            });
          });
          refresh();
          setInterval(refresh,1200);
          </script>
          </body>
          </html>""", mimetype="text/html")

              @remote.get("/frame")
              def frame():
                  rect = window.rectangle()
                  shot = pyautogui.screenshot(
                      region=(
                          rect.left, rect.top,
                          rect.width(), rect.height()
                      )
                  )
                  buf = io.BytesIO()
                  shot.save(buf, format="JPEG", quality=70)
                  return Response(buf.getvalue(), mimetype="image/jpeg")

              @remote.post("/click")
              def click():
                  d = request.get_json(force=True)
                  x = max(0, min(1, float(d.get("x", 0))))
                  y = max(0, min(1, float(d.get("y", 0))))
                  rect = window.rectangle()
                  pyautogui.click(
                      rect.left + int(x * rect.width()),
                      rect.top + int(y * rect.height())
                  )
                  return jsonify(ok=True)

              @remote.post("/key")
              def key():
                  name = str(
                      request.get_json(force=True).get("key", "")
                  ).lower()

                  allowed = {
                      "enter", "esc", "tab",
                      "up", "down", "left", "right",
                      "space", "backspace"
                  }

                  if name not in allowed:
                      return "Unsupported key", 400

                  pyautogui.press(name)
                  return jsonify(ok=True)

              @remote.post("/text")
              def text():
                  value = str(
                      request.get_json(force=True).get("text", "")
                  )[:500]

                  pyautogui.write(value, interval=0.02)
                  return jsonify(ok=True)

              server = make_server(
                  "127.0.0.1", 8765, remote, threaded=True
              )

              Thread(
                  target=server.serve_forever,
                  daemon=True
              ).start()

              print("Remote installer control ready.")
              print("Open the workflow summary link.")

              deadline = time.time() + 90 * 60

              while time.time() < deadline:
                  time.sleep(15)
                  screenshot("progress-latest.png")

                  try:
                      if not app.is_process_running():
                          break
                  except Exception:
                      pass
              else:
                  raise TimeoutError("Installer timed out.")

              screenshot("06-installer-finished.png")
              print("Installer process finished.")

          except Exception:
              traceback.print_exc()

              try:
                  screenshot("failure.png")
                  dump_windows()
              except Exception:
                  pass

              raise
          '@ | Set-Content -Encoding UTF8 run_installer.py

          py run_installer.py

      # -------------------------------------------------
      # PROJECT DREAM ANDROID FOLDER DISCOVERY
      # -------------------------------------------------

      - name: Find Project Dream Android folder
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Searching for Project Dream Android..."

          $roots = @(
            "$env:GITHUB_WORKSPACE",
            "$env:USERPROFILE",
            "$env:LOCALAPPDATA",
            "$env:APPDATA",
            "$env:RUNNER_TEMP",
            "C:\Users",
            "C:\"
          ) | Select-Object -Unique

          $foundFolders = @()

          foreach ($root in $roots) {
            if (-not (Test-Path $root)) {
              continue
            }

            Write-Host "Searching: $root"

            $found = Get-ChildItem `
              -LiteralPath $root `
              -Directory `
              -Filter "Project Dream Android" `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

            $foundFolders += $found
          }

          $foundFolders = @(
            $foundFolders |
            Sort-Object FullName -Unique
          )

          if ($foundFolders.Count -eq 0) {
            Write-Host "Project Dream Android folder not found."
            exit 0
          }

          foreach ($folder in $foundFolders) {
            Write-Host "FOUND: $($folder.FullName)"
          }

          $selected = $foundFolders |
            Sort-Object {
              (Get-ChildItem $_.FullName -Recurse -File `
                -Force -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum).Sum
            } -Descending |
            Select-Object -First 1

          "DREAM_ANDROID_FOLDER=$($selected.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "Selected folder: $($selected.FullName)"

      # -------------------------------------------------
      # COLLECT APK AND OBB FILES
      # -------------------------------------------------

      - name: Collect Project Dream Android files
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $destination = "output/android"

          New-Item -ItemType Directory -Force `
            $destination | Out-Null

          if (-not $env:DREAM_ANDROID_FOLDER) {
            Write-Host "No Project Dream Android folder was detected."
            exit 0
          }

          $source = $env:DREAM_ANDROID_FOLDER

          Write-Host "Collecting from: $source"

          # Save the complete installer output, preserving structure.
          $complete = Join-Path $destination "Project Dream Android"

          New-Item -ItemType Directory -Force `
            $complete | Out-Null

          Copy-Item -LiteralPath "$source\*" `
            -Destination $complete `
            -Recurse -Force `
            -ErrorAction Continue

          # Find all APK files.
          $apks = Get-ChildItem `
            -LiteralPath $source `
            -Recurse -Force -File `
            -Filter "*.apk" `
            -ErrorAction SilentlyContinue

          # Find all OBB files, including hidden files.
          $obbs = Get-ChildItem `
            -LiteralPath $source `
            -Recurse -Force -File `
            -Filter "*.obb" `
            -ErrorAction SilentlyContinue

          Write-Host "APK files found: $($apks.Count)"
          Write-Host "OBB files found: $($obbs.Count)"

          $index = 0

          foreach ($file in $apks) {
            $index++

            Write-Host "APK: $($file.FullName)"
            Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

            if ($index -eq 1) {
              Copy-Item $file.FullName `
                "$destination/ProjectDream.apk" -Force
            }
          }

          foreach ($file in $obbs) {
            Write-Host "================================="
            Write-Host "OBB: $($file.Name)"
            Write-Host "Path: $($file.FullName)"
            Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"
            Write-Host "Hidden: $($file.Attributes -match 'Hidden')"

            Get-FileHash $file.FullName -Algorithm SHA256
          }

          # Save a CSV inventory.
          @($apks) + @($obbs) |
            Select-Object FullName, Name, Length, Attributes |
            Export-Csv "diagnostics/android-files.csv" `
              -NoTypeInformation

      # -------------------------------------------------
      # CREATE COMPLETE ANDROID DATA ARCHIVE
      # -------------------------------------------------

      - name: Archive Project Dream Android folder
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $source = "output/android/Project Dream Android"

          if (-not (Test-Path $source)) {
            Write-Host "No Android folder to archive."
            exit 0
          }

          $files = Get-ChildItem $source -Recurse -Force -File

          if ($files.Count -eq 0) {
            Write-Host "Android folder is empty."
            exit 0
          }

          Compress-Archive `
            -Path "$source\*" `
            -DestinationPath "output/Project-Dream-Android-Data.zip" `
            -CompressionLevel NoCompression `
            -Force

          Write-Host "Created Android data archive."

          Get-Item "output/Project-Dream-Android-Data.zip" |
            Select-Object Name, Length

      # -------------------------------------------------
      # DIAGNOSTICS
      # -------------------------------------------------

      - name: Generate Android file report
        if: always()
        shell: pwsh
        run: |
          $report = @()
          $report += "PROJECT DREAM ANDROID REPORT"
          $report += "============================"
          $report += ""

          foreach ($path in @(
            "output/android",
            "output"
          )) {
            if (Test-Path $path) {
              $report += "FOLDER: $path"

              Get-ChildItem $path -Recurse -Force -File |
                ForEach-Object {
                  $report += "$($_.FullName)"
                  $report += "Size: $($_.Length) bytes"
                  $report += ""
                }
            }
          }

          $report |
            Out-File "diagnostics/android-report.txt"

          Write-Host ($report -join "`n")

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project-Dream-Android-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      # -------------------------------------------------
      # PREPARE RELEASE
      # -------------------------------------------------

      - name: Prepare Android release assets
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force `
            release-assets | Out-Null

          $files = @()

          if (Test-Path "output/android/ProjectDream.apk") {
            $files += Get-Item "output/android/ProjectDream.apk"
          }

          if (Test-Path "output/Project-Dream-Android-Data.zip") {
            $files += Get-Item "output/Project-Dream-Android-Data.zip"
          }

          if ($files.Count -eq 0) {
            throw "No Android release files were generated."
          }

          $maxPartBytes = 1800MB

          foreach ($file in $files) {
            $input = [IO.File]::OpenRead($file.FullName)

            try {
              $buffer = New-Object byte[] (8MB)
              $part = 0

              while ($input.Position -lt $input.Length) {
                $part++

                if ($input.Length -le $maxPartBytes) {
                  $name = Join-Path "release-assets" $file.Name
                }
                else {
                  $name = Join-Path "release-assets" (
                    "{0}.part{1:D3}" -f $file.Name, $part
                  )
                }

                $output = [IO.File]::Create($name)

                try {
                  $remaining = [Math]::Min(
                    [int64]$maxPartBytes,
                    $input.Length - $input.Position
                  )

                  while ($remaining -gt 0) {
                    $read = $input.Read(
                      $buffer, 0,
                      [int][Math]::Min($buffer.Length, $remaining)
                    )

                    if ($read -le 0) {
                      throw "Unexpected end of file."
                    }

                    $output.Write($buffer, 0, $read)
                    $remaining -= $read
                  }
                }
                finally {
                  $output.Dispose()
                }

                Write-Host "Created $name"
              }
            }
            finally {
              $input.Dispose()
            }
          }

          Get-ChildItem release-assets -File |
            ForEach-Object {
              Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 2)) MB"
            }

      # -------------------------------------------------
      # PUBLISH GITHUB RELEASE
      # -------------------------------------------------

      - name: Publish Project Dream Android Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: projectdream-android-${{ github.run_id }}-${{ github.run_attempt }}
          name: Project Dream Android
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*
          body: |
            # Project Dream Android

            Sonic Dream Team Android output generated using Project Dream.

            ## Included files

            - ProjectDream.apk (when generated)
            - Project-Dream-Android-Data.zip (complete installer output, including OBB files)

            The ZIP preserves the Project Dream Android folder structure.

            ## Split archives

            Files exceeding the release asset size threshold are split into numbered parts.

            Download all parts into the same folder.

            Reassemble split files in ascending order using PowerShell:

            ```powershell
            $out = [System.IO.File]::Create("Project-Dream-Android-Data.zip")

            try {
              Get-ChildItem "Project-Dream-Android-Data.zip.part*" |
                Sort-Object Name |
                ForEach-Object {
                  $input = [System.IO.File]::OpenRead($_.FullName)
                  try {
                    $input.CopyTo($out)
                  }
                  finally {
                    $input.Dispose()
                  }
                }
            }
            finally {
              $out.Dispose()
            }
            ```

            Extract the ZIP to access the complete Android output.
