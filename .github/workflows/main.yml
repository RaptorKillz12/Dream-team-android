
name: Inspect Project Dream v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - name: Download release installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = "adokova1111/project-dream-release"
          $tag = "v1.0.0"
          $encodedProject = [uri]::EscapeDataString($project)

          $api = "https://gitlab.com/api/v4/projects/$encodedProject/releases/$tag"

          Write-Host "Getting release metadata..."
          $release = Invoke-RestMethod -Uri $api

          $asset = $release.assets.links |
            Where-Object { $_.name -eq "Project_Dream.exe" } |
            Select-Object -First 1

          if (-not $asset) {
            Write-Host "Release assets returned by GitLab:"
            $release.assets.links |
              ForEach-Object { Write-Host $_.name $_.url }
            throw "Project_Dream.exe was not found in release assets."
          }

          New-Item -ItemType Directory -Force -Path tools, report | Out-Null

          $url = $asset.direct_asset_url
          if (-not $url) {
            $url = $asset.url
          }

          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $url -OutFile "tools/Project_Dream.exe"

          $file = Get-Item "tools/Project_Dream.exe"
          if ($file.Length -lt 100000) {
            throw "Installer download is unexpectedly small."
          }

          Write-Host "Downloaded $($file.Length) bytes."

      - name: Inspect executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = (Resolve-Path "tools/Project_Dream.exe").Path
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($path)

          $report = @(
            "Project Dream v1.0.0"
            "Filename: Project_Dream.exe"
            "Size: $((Get-Item $path).Length) bytes"
            "Product: $($info.ProductName)"
            "Description: $($info.FileDescription)"
            "File version: $($info.FileVersion)"
            ""
            "The installer has NOT been executed."
            "No APK has been built by this inspection workflow."
          )

          $report | Set-Content "report/installer-report.txt"

          Write-Host "Executable metadata:"
          $report | ForEach-Object { Write-Host $_ }

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: project-dream-v1.0.0-inspection
          path: report/installer-report.txt
          if-no-files-found: error
          retention-days: 7
