
name: Inspect Project Dream Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - name: Download Project Dream v1.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://gitlab.com/-/project/88190968/uploads/84deea92fbba738c95ef5b863a2fe313/Project_Dream.exe"

          New-Item -ItemType Directory -Force -Path tools, report | Out-Null

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "tools/Project_Dream.exe"

          $file = Get-Item "tools/Project_Dream.exe"

          if ($file.Length -lt 100000) {
            throw "Downloaded file is unexpectedly small."
          }

          Write-Host "Downloaded Project_Dream.exe"
          Write-Host "Size: $($file.Length) bytes"

      - name: Inspect installer metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = (Resolve-Path "tools/Project_Dream.exe").Path
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($path)

          @(
            "Project Dream v1.0.0"
            "Filename: Project_Dream.exe"
            "Size: $((Get-Item $path).Length) bytes"
            "Product: $($info.ProductName)"
            "Description: $($info.FileDescription)"
            "File version: $($info.FileVersion)"
            ""
            "The installer has not been executed."
            "This workflow does not yet build an APK."
          ) | Set-Content "report/installer-report.txt"

          Get-Content "report/installer-report.txt"

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: project-dream-installer-report
          path: report/installer-report.txt
          if-no-files-found: error
          retention-days: 7
